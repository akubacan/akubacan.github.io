<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>

  <!-- Plyr -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">

  <style>
    :root {
      --bg: #212122;
      --surface: #ffffff;
      --text: #ffffff;
      --muted: #777;
      --line: rgba(0,0,0,.08);
      --radius: 20px;
      --shadow: 0 18px 60px rgba(0,0,0,.10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 52px);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 750;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .section {
      margin-top: 44px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: -.01em;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    /* Photos */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .media-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,.035);
      transition: transform .35s cubic-bezier(.2,.7,.2,1),
                  box-shadow .35s ease;
    }

    .media-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .photo-card {
      aspect-ratio: 1 / 1;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .65s cubic-bezier(.2,.7,.2,1);
    }

    .photo-card:hover img {
      transform: scale(1.035);
    }

    .card-download {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 50%;
      background: rgba(15,15,15,.58);
      color: white;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      opacity: 0;
      transform: translateY(6px);
      transition: .25s ease;
    }

    .media-card:hover .card-download,
    .media-card:focus-within .card-download {
      opacity: 1;
      transform: translateY(0);
    }

    .card-download svg {
      width: 18px;
      height: 18px;
    }

    /* Video */
    .video-card {
      aspect-ratio: 16 / 9;
      background: #111;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
      filter: saturate(.9);
    }

    .video-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.5), transparent 55%);
      pointer-events: none;
    }

    .play-badge {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 68px;
      height: 68px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      background: rgba(255,255,255,.16);
      color: white;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 12px 35px rgba(0,0,0,.22);
      transition: transform .3s cubic-bezier(.2,.7,.2,1), background .3s ease;
      pointer-events: none;
    }

    .video-card:hover .play-badge {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(255,255,255,.23);
    }

    .play-badge svg {
      width: 25px;
      margin-left: 4px;
      fill: currentColor;
    }

    .video-label {
      position: absolute;
      left: 18px;
      bottom: 17px;
      color: white;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -.01em;
      pointer-events: none;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(8,8,8,.76);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .28s ease, visibility .28s ease;
    }

    .modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-content {
      position: relative;
      width: min(1120px, 100%);
      max-height: calc(100vh - 44px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .modal-top {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: .2s ease;
    }

    .modal-btn:hover {
      background: rgba(255,255,255,.18);
      transform: translateY(-1px);
    }

    .modal-btn svg {
      width: 18px;
      height: 18px;
    }

    .image-stage {
      position: relative;
      width: 100%;
      height: min(78vh, 820px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 16px;
      touch-action: none;
      cursor: grab;
    }

    .image-stage.dragging { cursor: grabbing; }

    #lightbox-image {
      max-width: 94%;
      max-height: 94%;
      user-select: none;
      -webkit-user-drag: none;
      transform: translate3d(0,0,0) scale(1);
      transform-origin: center center;
      transition: transform .28s cubic-bezier(.2,.7,.2,1);
      will-change: transform;
    }

    .zoom-tools {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(10,10,10,.5);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .zoom-tools button {
      width: 38px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .zoom-tools button:hover {
      background: rgba(255,255,255,.13);
    }

    .video-stage {
      width: 100%;
      max-height: calc(100vh - 120px);
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 30px 100px rgba(0,0,0,.35);
    }

    .video-stage .plyr {
      --plyr-color-main: #fff;
      --plyr-video-control-color: #fff;
      --plyr-video-control-color-hover: #fff;
      border-radius: 16px;
      overflow: hidden;
    }

    .modal-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: .2s ease;
    }

    .modal-download:hover {
      background: rgba(255,255,255,.18);
    }

    .modal-download svg {
      width: 16px;
      height: 16px;
    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 20px, 600px);
        padding-top: 26px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .media-card {
        border-radius: 15px;
      }

      .card-download {
        opacity: 1;
        transform: none;
        width: 36px;
        height: 36px;
        right: 9px;
        bottom: 9px;
      }

      .play-badge {
        width: 58px;
        height: 58px;
      }

      .modal {
        padding: 10px;
      }

      .image-stage {
        height: calc(100vh - 95px);
      }
    }

    @media (max-width: 420px) {
      .photo-grid {
        grid-template-columns: 1fr;
      }

      .photo-card {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Collection</p>
        <h1>Gallery</h1>
      </div>
      <div class="count">3 photos · 1 video</div>
    </header>

    <section class="section">
      <div class="section-title">
        <h2>Photos</h2>
        <span>Tap to view</span>
      </div>

      <div class="photo-grid">
        <article class="media-card photo-card" data-image="https://res.cloudinary.com/wtes366z/image/upload/v1789368327/final.png" data-name="final.png">
          <img src="https://res.cloudinary.com/wtes366z/image/upload/v1789368327/final.png" alt="Photo 1" loading="lazy">
          <button class="card-download" type="button" aria-label="Download photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>
            </svg>
          </button>
        </article>

        <article class="media-card photo-card" data-image="https://res.cloudinary.com/wtes366z/image/upload/v1789368326/final_2.png" data-name="final_2.png">
          <img src="https://res.cloudinary.com/wtes366z/image/upload/v1789368326/final_2.png" alt="Photo 2" loading="lazy">
          <button class="card-download" type="button" aria-label="Download photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>
            </svg>
          </button>
        </article>

        <article class="media-card photo-card" data-image="https://res.cloudinary.com/wtes366z/image/upload/v1789368322/final_3.png" data-name="final_3.png">
          <img src="https://res.cloudinary.com/wtes366z/image/upload/v1789368322/final_3.png" alt="Photo 3" loading="lazy">
          <button class="card-download" type="button" aria-label="Download photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>
            </svg>
          </button>
        </article>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>Video</h2>
        <span>Tap to play</span>
      </div>

      <article class="media-card video-card"
               id="video-card"
               data-video="https://res.cloudinary.com/wtes366z/video/upload/v1789368622/8953469589_132069990710682_1789312758064.mp4"
               data-name="video.mp4">
        <video class="video-thumb"
               src="https://res.cloudinary.com/wtes366z/video/upload/v1789368622/8953469589_132069990710682_1789312758064.mp4"
               preload="metadata"
               muted
               playsinline></video>
        <div class="video-shade"></div>

        <div class="play-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 4 8 4.4 8 5.2Z"/>
          </svg>
        </div>

        <div class="video-label">Watch video</div>

        <button class="card-download" id="video-download-card" type="button" aria-label="Download video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>
          </svg>
        </button>
      </article>
    </section>
  </main>

  <!-- Image modal -->
  <div class="modal" id="image-modal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-top">
        <button class="modal-btn" id="image-download" type="button" aria-label="Download image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>
          </svg>
        </button>
        <button class="modal-btn" id="image-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>

      <div class="image-stage" id="image-stage">
        <img id="lightbox-image" alt="">
        <div class="zoom-tools">
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="zoom-reset" aria-label="Reset zoom">1:1</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Video modal -->
  <div class="modal" id="video-modal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-top">
        <button class="modal-btn" id="video-download" type="button" aria-label="Download video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>
          </svg>
        </button>
        <button class="modal-btn" id="video-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>

      <div class="video-stage">
        <video id="player" playsinline controls crossorigin>
          <source src="https://res.cloudinary.com/wtes366z/video/upload/v1789368622/8953469589_132069990710682_1789312758064.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <script src="https://cdn.plyr.io/3.8.4/plyr.js"></script>

  <script>
    const imageModal = document.getElementById('image-modal');
    const videoModal = document.getElementById('video-modal');
    const lightboxImage = document.getElementById('lightbox-image');
    const imageStage = document.getElementById('image-stage');

    const videoUrl =
      'https://res.cloudinary.com/wtes366z/video/upload/v1789368622/8953469589_132069990710682_1789312758064.mp4';

    let currentImageUrl = '';
    let currentImageName = 'image.png';

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let dragging = false;
    let startX = 0;
    let startY = 0;

    function applyImageTransform(animated = true) {
      lightboxImage.style.transition = animated
        ? 'transform .28s cubic-bezier(.2,.7,.2,1)'
        : 'none';
      lightboxImage.style.transform =
        `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
    }

    function resetZoom() {
      scale = 1;
      panX = 0;
      panY = 0;
      applyImageTransform();
    }

    function setZoom(next) {
      scale = Math.min(5, Math.max(1, next));
      if (scale === 1) {
        panX = 0;
        panY = 0;
      }
      applyImageTransform();
    }

    function openImage(url, name) {
      currentImageUrl = url;
      currentImageName = name;
      lightboxImage.src = url;
      lightboxImage.alt = name;
      resetZoom();

      imageModal.classList.add('open');
      imageModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeImage() {
      imageModal.classList.remove('open');
      imageModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.photo-card').forEach(card => {
      const url = card.dataset.image;
      const name = card.dataset.name;

      card.addEventListener('click', event => {
        if (event.target.closest('.card-download')) return;
        openImage(url, name);
      });

      card.querySelector('.card-download').addEventListener('click', event => {
        event.stopPropagation();
        downloadFile(url, name);
      });
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      setZoom(scale + .5);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      setZoom(scale - .5);
    });

    document.getElementById('zoom-reset').addEventListener('click', resetZoom);

    imageStage.addEventListener('wheel', event => {
      event.preventDefault();
      setZoom(scale + (event.deltaY < 0 ? .25 : -.25));
    }, { passive: false });

    imageStage.addEventListener('dblclick', () => {
      setZoom(scale > 1 ? 1 : 2);
    });

    imageStage.addEventListener('pointerdown', event => {
      if (scale <= 1) return;
      dragging = true;
      imageStage.classList.add('dragging');
      startX = event.clientX - panX;
      startY = event.clientY - panY;
      imageStage.setPointerCapture(event.pointerId);
    });

    imageStage.addEventListener('pointermove', event => {
      if (!dragging) return;
      panX = event.clientX - startX;
      panY = event.clientY - startY;
      applyImageTransform(false);
    });

    imageStage.addEventListener('pointerup', () => {
      dragging = false;
      imageStage.classList.remove('dragging');
    });

    imageStage.addEventListener('pointercancel', () => {
      dragging = false;
      imageStage.classList.remove('dragging');
    });

    document.getElementById('image-close').addEventListener('click', closeImage);

    document.getElementById('image-download').addEventListener('click', () => {
      downloadFile(currentImageUrl, currentImageName);
    });

    /* Plyr */
    const player = new Plyr('#player', {
      controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'duration',
        'mute',
        'volume',
        'settings',
        'pip',
        'fullscreen'
      ],
      settings: ['speed'],
      clickToPlay: true,
      hideControls: true,
      keyboard: { focused: true, global: true },
      fullscreen: {
        enabled: true,
        fallback: true,
        iosNative: true
      }
    });

    /*
      Mobile-friendly fullscreen:
      - On phones/tablets, starting playback requests fullscreen.
      - When the browser supports Screen Orientation Lock, landscape is
        requested while the video is fullscreen.
      - On browsers that do not permit orientation locking, fullscreen
        still works and the OS/browser keeps its normal orientation.
    */
    async function enterVideoFullscreen() {
      try {
        if (!player.fullscreen.active) {
          await player.fullscreen.enter();
        }
      } catch (e) {
        // Some browsers require the fullscreen request to happen directly
        // from a user gesture. Plyr/native controls can still handle it.
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) {
        // Orientation locking is not supported/allowed on every device.
      }
    }

    async function unlockVideoOrientation() {
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (e) {}
    }

    player.on('play', () => {
      if (window.matchMedia('(pointer: coarse)').matches) {
        enterVideoFullscreen();
      }
    });

    player.on('exitfullscreen', () => {
      unlockVideoOrientation();
    });

    function openVideo() {
      videoModal.classList.add('open');
      videoModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      player.currentTime = 0;

      // Desktop: play normally inside the modal.
      // Mobile/tablet: the play event will request fullscreen.
      player.play().catch(() => {});
    }

    async function closeVideo() {
      player.pause();

      try {
        if (player.fullscreen.active) {
          await player.fullscreen.exit();
        }
      } catch (e) {}

      await unlockVideoOrientation();

      videoModal.classList.remove('open');
      videoModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    document.getElementById('video-card').addEventListener('click', event => {
      if (event.target.closest('.card-download')) return;
      openVideo();
    });

    document.getElementById('video-download-card').addEventListener('click', event => {
      event.stopPropagation();
      downloadFile(videoUrl, 'video.mp4');
    });

    document.getElementById('video-close').addEventListener('click', closeVideo);

    document.getElementById('video-download').addEventListener('click', () => {
      downloadFile(videoUrl, 'video.mp4');
    });

    /* Download helper: fetches the Cloudinary asset so the browser tries
       to save it instead of simply navigating to the asset URL. */
    async function downloadFile(url, filename) {
      try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error('Download failed');

        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);
      } catch (error) {
        // Fallback if the browser/server blocks programmatic CORS download.
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    }

    /* Close by clicking the dark area */
    imageModal.addEventListener('click', event => {
      if (event.target === imageModal) closeImage();
    });

    videoModal.addEventListener('click', event => {
      if (event.target === videoModal) closeVideo();
    });

    /* ESC */
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;

      if (imageModal.classList.contains('open')) closeImage();
      if (videoModal.classList.contains('open')) closeVideo();
    });
  </script>
</body>
</html>
